{% load static %}
<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ConnectHub</title><link rel="stylesheet" href="{% static 'css/style.css' %}"></head><body>
<header class="topbar"><a class="brand" href="{% url 'feed' %}">connect<span>hub</span></a>
<nav>{% if user.is_authenticated %}<a href="{% url 'feed' %}">Home</a><a href="{% url 'profile' user.username %}">My profile</a>
<form method="post" action="{% url 'logout' %}" class="inline">{% csrf_token %}<button class="navbtn">Log out</button></form>
{% else %}<a href="{% url 'login' %}">Login</a><a class="nav-cta" href="{% url 'register' %}">Join now</a>{% endif %}</nav></header>
<main class="container">{% for message in messages %}<div class="message">{{ message }}</div>{% endfor %}{% block content %}{% endblock %}</main>
<script src="{% static 'js/app.js' %}"></script></body></html>
